<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GratiWall, the campus appreciation & recognition wall. Send a thank-you, brighten someone's day." />
    <title>GratiWall · Campus Appreciation Wall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c2410c'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='17' fill='%23faf7f2' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E" />
    <script>
      // Set the theme before first paint to avoid a flash of the wrong palette.
      (function () {
        var saved = localStorage.getItem('gratiwall-theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      /* Intro splash: a title card shown once per full page load. Pure CSS; the
         overlay removes itself from the DOM after the animation ends. */
      #intro {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf7f2;
        animation: intro-exit 600ms cubic-bezier(0.4, 0, 0.2, 1) 3.1s forwards;
      }
      [data-theme='dark'] #intro { background: #161412; }
      #intro .intro-mark { text-align: center; }
      #intro .intro-word {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 700;
        font-size: clamp(2.4rem, 6vw, 4rem);
        letter-spacing: -0.01em;
        color: #1c1917;
        display: inline-flex;
        overflow: hidden;
      }
      [data-theme='dark'] #intro .intro-word { color: #f5f1ea; }
      #intro .intro-word .ltr {
        display: inline-block;
        transform: translateY(110%);
        animation: intro-letter 420ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      #intro .intro-line {
        display: block;
        width: min(280px, 40vw);
        height: 2px;
        margin: 14px auto 12px;
        background: #c2410c;
        transform: scaleX(0);
        transform-origin: left center;
        animation: intro-line 550ms cubic-bezier(0.22, 1, 0.36, 1) 1000ms forwards;
      }
      [data-theme='dark'] #intro .intro-line { background: #ea580c; }
      #intro .intro-sub {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #c2410c;
        opacity: 0;
        animation: intro-fade 450ms ease 1250ms forwards;
      }
      [data-theme='dark'] #intro .intro-sub { color: #ea580c; }
      @keyframes intro-letter { to { transform: translateY(0); } }
      @keyframes intro-line { to { transform: scaleX(1); } }
      @keyframes intro-fade { to { opacity: 1; } }
      @keyframes intro-exit {
        to { opacity: 0; transform: translateY(-14px); visibility: hidden; }
      }
      @media (prefers-reduced-motion: reduce) {
        #intro { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="intro" aria-hidden="true">
      <div class="intro-mark">
        <span class="intro-word">
          <span class="ltr" style="animation-delay: 150ms">G</span><span class="ltr" style="animation-delay: 215ms">r</span><span class="ltr" style="animation-delay: 280ms">a</span><span class="ltr" style="animation-delay: 345ms">t</span><span class="ltr" style="animation-delay: 410ms">i</span><span class="ltr" style="animation-delay: 475ms">W</span><span class="ltr" style="animation-delay: 540ms">a</span><span class="ltr" style="animation-delay: 605ms">l</span><span class="ltr" style="animation-delay: 670ms">l</span>
        </span>
        <span class="intro-line"></span>
        <span class="intro-sub">Campus appreciation, pinned in public</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Remove the intro overlay from the DOM once its animation has finished.
      setTimeout(function () {
        var el = document.getElementById('intro');
        if (el) el.remove();
      }, 4200);
    </script>
  </body>
</html>
